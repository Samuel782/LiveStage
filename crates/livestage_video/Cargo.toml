[package]
name = "livestage_video"
description = "wgpu render engine: compositing, projection mapping, video sources, NDI interfaces"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
livestage_core.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
image.workspace = true
chrono.workspace = true
libloading.workspace = true
parking_lot.workspace = true
pollster.workspace = true
ffmpeg-next = { workspace = true, optional = true }
hayro.workspace = true
zip.workspace = true
roxmltree.workspace = true
kurbo.workspace = true
ab_glyph.workspace = true
epaint_default_fonts.workspace = true

thiserror.workspace = true
tracing.workspace = true

# Zero-copy import of hardware-decoded frames (see `native`).
[target.'cfg(target_os = "macos")'.dependencies]
wgpu-external-frame = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu-external-frame = "0.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[features]
# Movie-file backend via the system FFmpeg libraries (see README).
ffmpeg = ["dep:ffmpeg-next"]

