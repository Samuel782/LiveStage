[package]
name = "livestage_ui"
description = "LiveStage operator application: egui control surface + kiosk program outputs"
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "livestage"
path = "src/main.rs"

[features]
ffmpeg = ["livestage_video/ffmpeg", "dep:ffmpeg-sys-next"]

[dependencies]
livestage_core.workspace = true
livestage_audio.workspace = true
livestage_video.workspace = true
livestage_dmx.workspace = true
livestage_control.workspace = true
wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
egui_dock.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
image.workspace = true
pollster.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
# Only for its `links` metadata: build.rs adds an rpath to a provided FFmpeg.
ffmpeg-sys-next = { version = "9.0.1", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"
# Dock icon (same versions egui-winit already uses).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

# Windows: the .exe icon resource (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
